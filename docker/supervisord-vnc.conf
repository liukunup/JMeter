[supervisord]
nodaemon=true
user=root
# logging configuration
logfile=/var/log/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info

[program:xvfb]
command=/usr/bin/Xvfb %(ENV_DISPLAY)s -screen 0 %(ENV_RESOLUTION)sx%(ENV_DEPTH)s -ac +extension GLX +render -noreset
user=root
priority=100      # 优先级数值越大则启动更早
autostart=true    # 自动启动
autorestart=true  # 自动重启
startsecs=5       # 等待 5 秒确认启动成功
# logging configuration
stdout_logfile=/var/log/xvfb.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=3
redirect_stderr=true

[program:x11vnc]
command=/usr/bin/x11vnc -display %(ENV_DISPLAY)s -rfbauth /home/%(ENV_USERNAME)s/.vnc/passwd -forever -shared -noxdamage -noshm
user=%(ENV_USERNAME)s  # 降权运行
environment=DISPLAY="%(ENV_DISPLAY)s",HOME="/home/%(ENV_USERNAME)s"
priority=90
autostart=true
autorestart=true
startsecs=3
# logging configuration
stdout_logfile=/var/log/x11vnc.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=3
redirect_stderr=true

[program:startxfce4]
command=/usr/bin/dbus-launch --exit-with-session /usr/bin/startxfce4
user=%(ENV_USERNAME)s  # 降权运行
environment=DISPLAY="%(ENV_DISPLAY)s",HOME="/home/%(ENV_USERNAME)s"
priority=80
autostart=true
autorestart=true
startsecs=10
startretries=3
# logging configuration
stdout_logfile=/var/log/xfce4_%(ENV_USERNAME)s.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=3
redirect_stderr=true

[program:novnc]
command=/usr/share/novnc/utils/novnc_proxy --vnc 0.0.0.0:5900 --listen 6080 --web /usr/share/novnc --cert /root/.certs/novnc.crt --key /root/.certs/novnc.key --heartbeat 10 --timeout 300
user=root
priority=70
autostart=true
autorestart=true
startsecs=5
startretries=3
# logging configuration
stdout_logfile=/var/log/novnc_proxy.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=3
redirect_stderr=true