[supervisord]
nodaemon=true
user=root

[program:xvfb]
command=/usr/bin/Xvfb %(ENV_DISPLAY)s -screen 0 1280x800x24 -ac +extension GLX
environment=DISPLAY="%(ENV_DISPLAY)s"
autostart=true
autorestart=true
priority=100
startsecs=5

[program:dbus]
command=/usr/bin/dbus-launch --sh-syntax
user=%(ENV_USERNAME)s  # 降权运行
environment=DISPLAY="%(ENV_DISPLAY)s",HOME="/home/%(ENV_USERNAME)s"
autostart=true
autorestart=true
priority=90

[program:x11vnc]
command=/usr/bin/x11vnc -display %(ENV_DISPLAY)s -rfbauth /home/%(ENV_USERNAME)s/.vnc/passwd -forever -shared -noxdamage
user=%(ENV_USERNAME)s  # 降权运行
environment=DISPLAY="%(ENV_DISPLAY)s",HOME="/home/%(ENV_USERNAME)s"
autostart=true
autorestart=true
priority=80
startsecs=3

[program:startxfce4]
command=/usr/bin/startxfce4
user=%(ENV_USERNAME)s  # 降权运行
environment=DISPLAY="%(ENV_DISPLAY)s",HOME="/home/%(ENV_USERNAME)s"
autostart=true
autorestart=true
priority=70

[program:novnc]
command=/usr/share/novnc/utils/novnc_proxy --vnc 0.0.0.0:5900 --listen 6080 --web /usr/share/novnc --cert /root/.certs/vnc.crt --key /root/.certs/vnc.key --heartbeat 10 --timeout 300
autostart=true
autorestart=true
priority=60
