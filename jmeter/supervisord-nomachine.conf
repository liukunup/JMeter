[supervisord]
nodaemon=true
user=root
# logging configuration
logfile=/var/log/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info

[program:dbus]
command=/usr/bin/dbus-daemon --system --nofork
user=root
priority=100      # 优先级数值越大则启动更早
autostart=true    # 自动启动
autorestart=true  # 自动重启
startsecs=2       # 等待 2 秒确认启动成功
startretries=5    # 失败后重试 5 次
# logging configuration
stdout_logfile=/var/log/dbus.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=3
redirect_stderr=true

[program:xvfb]
command=/usr/bin/Xvfb %(ENV_DISPLAY)s -screen 0 1920x1080x24 -ac +extension GLX +render -noreset
user=root
priority=90
autostart=true
autorestart=true
startsecs=5
# logging configuration
stdout_logfile=/var/log/xvfb.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=3
redirect_stderr=true

[program:startxfce4]
command=/usr/bin/dbus-launch --exit-with-session /usr/bin/startxfce4
user=%(ENV_USERNAME)s  # 降权运行
environment=DISPLAY="%(ENV_DISPLAY)s",HOME="/home/%(ENV_USERNAME)s"
priority=80
autostart=true
autorestart=true
startsecs=10
startretries=3
# logging configuration
stdout_logfile=/var/log/xfce4_%(ENV_USERNAME)s.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=3
redirect_stderr=true
