          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_JMETER_IMAGE_VERSION=${{ matrix.jmeter }}-${{ matrix.os }}-${{ matrix.version }}-${{ matrix.jre }}-plugins-${{ steps.get_short_sha.outputs.SHORT_SHA }}

  # Ubuntu
