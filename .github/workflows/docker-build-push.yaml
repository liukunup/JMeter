name: JMeter Docker Images CI/CD

on:
  push:
    branches:
      - dev
      - feature/*
    paths-ignore:
      - 'README.md'
      - 'README_EN.md'
      - 'LICENSE'
      - 'deploy/**'
      - 'docs/**'
      - 'helm-charts/**'
      - 'scripts/**'
  pull_request:
    branches:
      - dev
    paths-ignore:
      - 'README.md'
      - 'README_EN.md'
      - 'LICENSE'
      - 'deploy/**'
      - 'docs/**'
      - 'helm-charts/**'
      - 'scripts/**'

env:
  DOCKER_HUB_REPO: ${{ secrets.DOCKER_HUB_USERNAME }}/jmeter

jobs:
  # Alpine
  build-alpine-jmeter-images:
    name: Build Alpine JMeter Images
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:  # format: {jmeter}-{os}-{version}-{jre}
        jmeter: ["5.6.3"]
        jre: ["openjdk-21-jre", "openjdk-8-jre"]
        version: ["3"]
        os: ["alpine"]
        include:
          - dockerfile: "jmeter/Dockerfile.Alpine"
          - jre_map: '{
              "openjdk-21-jre": "openjdk21-jre",
              "openjdk-8-jre": "openjdk8-jre"
            }'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Get actual JRE package name
        id: get_jre
        run: |
          JRE_MAP='${{ matrix.jre_map }}'
          JRE_PKG=$(echo "$JRE_MAP" | jq -r '.["${{ matrix.jre }}"]')
          echo "JRE_PKG=${JRE_PKG}" >> $GITHUB_OUTPUT

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKER_HUB_REPO }}
          tags: |
            type=sha,format=short,prefix=${{ matrix.jmeter }}-${{ matrix.os }}-${{ matrix.version }}-${{ matrix.jre }}-
          labels: |
            org.opencontainers.image.title=JMeter
            org.opencontainers.image.description=Apache JMeter Docker image based on ${{ matrix.os }}:${{ matrix.version }} with ${{ matrix.jre }}
            org.opencontainers.image.version=${{ matrix.jmeter }}

      - name: Build and Push Docker Images
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE_VERSION=${{ matrix.version }}
            JMETER_VERSION=${{ matrix.jmeter }}
            JRE_VERSION=${{ steps.get_jre.outputs.JRE_PKG }}

  build-alpine-jmeter-images-with-plugins:
    name: Build Alpine JMeter Images with Plugins
    needs: build-alpine-jmeter-images
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:  # format: {jmeter}-{os}-{version}-{jre}-plugins
        jmeter: ["5.6.3"]
        jre: ["openjdk-21-jre", "openjdk-8-jre"]
        version: ["3"]
        os: ["alpine"]
