name: JMeter Docker Images CI/CD

on:
  push:
    branches:
      - dev
      - feature/*
    paths-ignore:
      - '**.md'
      - '**.jmx'
      - '**.png'

env:
  JMETER_VERSION: 5.6.3
  DOCKER_HUB_REPO: ${{ secrets.DOCKER_HUB_USERNAME }}/jmeter

jobs:
  build-jmeter-images:
    name: Build JMeter Images
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:
        include:
          # Alpine
          - dockerfile: "jmeter/Dockerfile.Alpine"
            os: "alpine"
            version: "3"
            jre: "openjdk21-jre"
          - dockerfile: "jmeter/Dockerfile.Alpine"
            os: "alpine"
            version: "3"
            jre: "openjdk8-jre"
          # Ubuntu
          - dockerfile: "jmeter/Dockerfile.Ubuntu"
            os: "ubuntu"
            version: "24.04"
            jre: "openjdk-21-jre"
          - dockerfile: "jmeter/Dockerfile.Ubuntu"
            os: "ubuntu"
            version: "24.04"
            jre: "openjdk-8-jre"
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKER_HUB_REPO }}
          tags: |
            type=sha,format=short,prefix=${{ env.JMETER_VERSION }}-${{ matrix.os }}-${{ matrix.version }}-${{ matrix.jre }}-,enable=${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=JMeter
            org.opencontainers.image.description=Apache JMeter Docker image based on ${{ matrix.os }}:${{ matrix.version }} with ${{ matrix.jre }}
            org.opencontainers.image.version=${{ env.JMETER_VERSION }}

      - name: Build and Push Docker Images
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE_VERSION=${{ matrix.version }}
            JMETER_VERSION=${{ env.JMETER_VERSION }}
            JRE_VERSION=${{ matrix.jre }}

  build-jmeter-images-with-plugins:
    name: Build JMeter Images with Plugins
    needs: build-jmeter-images
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:
        include:
          # Alpine
          - os: "alpine"
            version: "3"
            jre: "openjdk21-jre"
          - os: "alpine"
            version: "3"
            jre: "openjdk8-jre"
          # Ubuntu
          - os: "ubuntu"
            version: "24.04"
            jre: "openjdk-21-jre"
          - os: "ubuntu"
            version: "24.04"
            jre: "openjdk-8-jre"
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKER_HUB_REPO }}
          tags: |
            type=sha,format=short,prefix=${{ env.JMETER_VERSION }}-${{ matrix.os }}-${{ matrix.version }}-${{ matrix.jre }}-plugins-,enable=${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=JMeter with Plugins
            org.opencontainers.image.description=Apache JMeter Docker image based on ${{ matrix.os }}:${{ matrix.version }} with ${{ matrix.jre }}, including additional plugins
            org.opencontainers.image.version=${{ env.JMETER_VERSION }}

      - name: Get Short SHA
        id: get_short_sha
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Images
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          file: jmeter/Dockerfile.Plugins
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_JMETER_IMAGE_VERSION=${{ env.JMETER_VERSION }}-${{ matrix.os }}-${{ matrix.version }}-${{ matrix.jre }}-${{ steps.get_short_sha.outputs.SHORT_SHA }}

  build-jmeter-images-with-gui:
    name: Build JMeter Images with GUI
    needs: build-jmeter-images-with-plugins
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:
        include:
          # Ubuntu
          - dockerfile: "jmeter/Dockerfile.Ubuntu-with-X11"
            os: "ubuntu"
            version: "24.04"
            jre: "openjdk-21-jre"
            gui: "x11"
          - dockerfile: "jmeter/Dockerfile.Ubuntu-with-VNC-NoVNC"
            os: "ubuntu"
            version: "24.04"
            jre: "openjdk-21-jre"
            gui: "vnc-novnc"
          - dockerfile: "jmeter/Dockerfile.Ubuntu-with-RDP"
            os: "ubuntu"
            version: "24.04"
            jre: "openjdk-21-jre"
            gui: "rdp"
          - dockerfile: "jmeter/Dockerfile.Ubuntu-with-FullStack"
            os: "ubuntu"
            version: "24.04"
            jre: "openjdk-21-jre"
            gui: "fullstack"
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKER_HUB_REPO }}
          tags: |
            type=sha,format=short,prefix=${{ env.JMETER_VERSION }}-${{ matrix.os }}-${{ matrix.version }}-${{ matrix.jre }}-${{ matrix.gui }}-,enable=${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=JMeter with GUI
            org.opencontainers.image.description=Apache JMeter Docker image based on ${{ matrix.os }}:${{ matrix.version }} with ${{ matrix.jre }}, including GUI support for ${{ matrix.gui }}
            org.opencontainers.image.version=${{ env.JMETER_VERSION }}

      - name: Get Short SHA
        id: get_short_sha
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Images
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_JMETER_IMAGE_VERSION=${{ env.JMETER_VERSION }}-${{ matrix.os }}-${{ matrix.version }}-${{ matrix.jre }}-plugins-${{ steps.get_short_sha.outputs.SHORT_SHA }}
