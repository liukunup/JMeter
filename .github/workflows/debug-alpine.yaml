name: JMeter Docker Images CI/CD

on:
  push:
    branches:
      - disable/*
    paths-ignore:
      - 'deploy/**'
      - 'docs/**'
      - 'scripts/**'
      - 'testcases/**'
      - 'jmeter.code-workspace'
      - 'LICENSE'
      - 'README.md'
      - 'README_EN.md'
  pull_request:
    branches:
      - disable/*
    paths-ignore:
      - 'deploy/**'
      - 'docs/**'
      - 'scripts/**'
      - 'testcases/**'
      - 'jmeter.code-workspace'
      - 'LICENSE'
      - 'README.md'
      - 'README_EN.md'

env:
  REGISTRY: docker.io
  REPOSITORY: ${{ secrets.DOCKER_HUB_USERNAME }}/jmeter

jobs:
  # Shell Check
  shellcheck:
    name: Run Shell Check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Shell Check
        run: |
          # 安装 shellcheck
          sudo apt-get update && sudo apt-get install -y shellcheck
          # 检查所有 .sh 文件
          find docker -type f -name "*.sh" -print0 | xargs -0 shellcheck -x -o all

  # Alpine
  build-alpine-jmeter-images:
    name: Build JMeter images based on Alpine
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:  # format: {jmeter}-{os}-{version}-{jre}
        jmeter: ["5.6.3"]
        jre: ["openjdk-21-jre"]
        version: ["3"]
        os: ["alpine"]
        include:
          - dockerfile: "docker/Dockerfile.Alpine"
          - jre_map: |
              {
                "openjdk-21-jre": "openjdk21-jre",
                "openjdk-17-jre": "openjdk17-jre",
                "openjdk-11-jre": "openjdk11-jre",
                "openjdk-8-jre": "openjdk8-jre"
              }
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Get actual JRE package name
        id: get_jre
        run: |
          JRE_MAP='${{ matrix.jre_map }}'
          JRE_PKG=$(echo "$JRE_MAP" | jq -r '.["${{ matrix.jre }}"]')
          echo "JRE_PKG=${JRE_PKG}" >> $GITHUB_OUTPUT

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}
          tags: |
            type=sha,format=short,prefix=${{ matrix.jmeter }}-${{ matrix.os }}-${{ matrix.version }}-${{ matrix.jre }}-
          labels: |
            org.opencontainers.image.title=JMeter
            org.opencontainers.image.description=Apache JMeter Docker image based on ${{ matrix.os }}:${{ matrix.version }} with ${{ matrix.jre }}
            org.opencontainers.image.version=${{ matrix.jmeter }}

      - name: Build and Push Docker Images
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE_VERSION=${{ matrix.version }}
            JMETER_VERSION=${{ matrix.jmeter }}
            JRE_VERSION=${{ steps.get_jre.outputs.JRE_PKG }}

  build-alpine-jmeter-images-with-plugins:
    name: Build JMeter images based on Alpine with Plugins
    needs: build-alpine-jmeter-images
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:  # format: {jmeter}-{os}-{version}-{jre}-plugins
        jmeter: ["5.6.3"]
        jre: ["openjdk-21-jre"]
        version: ["3"]
        os: ["alpine"]
        include:
          - dockerfile: "docker/Dockerfile.Plugins"
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}
          tags: |
            type=sha,format=short,prefix=${{ matrix.jmeter }}-${{ matrix.os }}-${{ matrix.version }}-${{ matrix.jre }}-plugins-
          labels: |
            org.opencontainers.image.title=JMeter with Plugins
            org.opencontainers.image.description=Apache JMeter Docker image based on ${{ matrix.os }}:${{ matrix.version }} with ${{ matrix.jre }}, including additional plugins
            org.opencontainers.image.version=${{ matrix.jmeter }}

      - name: Get Short SHA
        id: get_short_sha
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Images
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_JMETER_IMAGE=${{ env.REGISTRY }}/${{ env.REPOSITORY }}:${{ matrix.jmeter }}-${{ matrix.os }}-${{ matrix.version }}-${{ matrix.jre }}-${{ steps.get_short_sha.outputs.SHORT_SHA }}

  build-alpine-jmeter-images-with-business:
    name: Build JMeter images based on Alpine with Business
    needs: build-alpine-jmeter-images-with-plugins
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:  # format: {jmeter}-{os}-{version}-{jre}-business
        jmeter: ["5.6.3"]
        jre: ["openjdk-21-jre"]
        version: ["3"]
        os: ["alpine"]
        include:
          - dockerfile: "docker/Dockerfile.Business"
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}
          tags: |
            type=sha,format=short,prefix=${{ matrix.jmeter }}-${{ matrix.os }}-${{ matrix.version }}-${{ matrix.jre }}-business-
          labels: |
            org.opencontainers.image.title=JMeter with Business
            org.opencontainers.image.description=Apache JMeter Docker image based on ${{ matrix.os }}:${{ matrix.version }} with ${{ matrix.jre }}, including additional business
            org.opencontainers.image.version=${{ matrix.jmeter }}

      - name: Get Short SHA
        id: get_short_sha
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Images
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_JMETER_IMAGE=${{ env.REGISTRY }}/${{ env.REPOSITORY }}:${{ matrix.jmeter }}-${{ matrix.os }}-${{ matrix.version }}-${{ matrix.jre }}-plugins-${{ steps.get_short_sha.outputs.SHORT_SHA }}
